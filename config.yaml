# ARK (Autonomous Resilient Kernel) — Runtime Configuration
# ----------------------------------------------------------

# グローバルなデフォルト（もし個別に指定がない時に使われるわ）
model_name: "qwen2.5-coder:7b"

# Ollama のエンドポイント（Mac の Ollama ならこれで OK ！）
api_endpoint: "http://localhost:11434"

# ワークスペース
workspace_path: "workspace"

# ---------------------------------------------------------------------------
# Per-agent provider settings (Strategy pattern)
# ---------------------------------------------------------------------------
# ここを全部 "ollama" にするのが「自宅モード」の絶対条件よ！💋
architect_provider: "ollama"
coder_provider: "ollama"
reviewer_provider: "ollama"
reflector_provider: "ollama"  # 👈 Reflector 用のプロバイダを追加！

# ---------------------------------------------------------------------------
# Role-specific Model Selection for Ollama
# ---------------------------------------------------------------------------
# ジェニーの MacBook Air に入ってる「最強パーティ」をセットするわよ！
architect_model: "gemma4:e4b"
coder_model: "qwen2.5-coder:7b"
reviewer_model: "llama3.2:3b"
reflector_model: "llama3.2:3b"  # 👈 Reflector 用のモデルを追加（Reviewerと同じかgemma4:e4bがオススメ）

# ---------------------------------------------------------------------------
# Google Gemini settings (会社に戻った時はここを gemini に戻してね)
# ---------------------------------------------------------------------------
gemini_api_key: ""
architect_model_gemini: "gemini-2.5-flash"
coder_model_gemini: "gemini-2.5-flash"
reviewer_model_gemini: "gemini-2.5-flash"
reflector_model_gemini: "gemini-2.5-flash" # 👈 Geminiモード用も忘れずに！



# ==========================================
# ARK: Model Configuration Patterns
# Generated by Noah for Jenny 💖
# ==========================================

# 1. 【Google AI Plus特化】Gemini 艦隊 (Stability & Value)
# サブスク枠をフル活用！連携の速さと安定感はピカイチ。
pattern_gemini_fleet:
  architect: "gemini-2.5-Pro"     # 深い洞察力で海図を描く
  coder:     "gemini-2.5-flash"   # 爆速でコードを射出
  reviewer:  "gemini-2.5-Pro"     # 厳格なセキュリティ＆バグチェック
  reflector: "gemini-2.5-Pro"     # 「大図書館」への要約精度MAX

# 2. 【Reasoning特化】DeepSeek 自律航行モード (Autonomous & Debug)
# 思考ログ（Thinking）を活用し、自己修復ループを最強にする構成。
pattern_reasoning_master:
  architect: "deepseek-v3.2"      # 論理的なステップバイステップの計画
  coder:     "deepseek-v3.2"      # Thinkingモードでバグを自力で潰す
  reviewer:  "gemini-2.5-Pro"     # Googleの論理で多角的にチェック
  reflector: "llama-4-70b"        # ローカル/APIで知見を構造化

# 3. 【美コード至上主義】Claude 芸術船団 (Quality & Design)
# 人間が見て「美しい」と感じる設計と実装を追求するならこれ。
pattern_aesthetic_artisan:
  architect: "claude-4.6-sonnet"  # センスの良いアーキテクチャ設計
  coder:     "claude-4.6-sonnet"  # リーダブルな最高級の実装
  reviewer:  "gemini-2.5-flash"   # スピード重視の自動レビュー
  reflector: "gemini-2.5-flash"   # 簡潔な知見の抽出

# 4. 【大規模プロジェクト専用】コンテキスト大海原 (Big Context)
# 既存コードが数万行あるプロジェクトの改修に特化。
pattern_context_voyager:
  architect: "gemini-2.5-Pro"     # 200万トークンで全コードを把握
  coder:     "gemini-2.5-flash"   # 巨大な文脈を維持したまま改修
  reviewer:  "gpt-5-mini"         # 外部視点での厳格なロジック検証
  reflector: "gemini-2.5-Pro"     # プロジェクト全史をアーカイブ

# 5. 【究極のハイブリッド】ARK: Genesis 2026 (The Avengers)
# 各分野のSOTA（最先端）を繋ぎ合わせた、現時点の理論上最強パーティ。
pattern_ark_genesis:
  architect: "gpt-5-o"            # 意思決定と計画の神
  coder:     "deepseek-v3.2"      # 泥臭い実装と試行錯誤の鬼
  reviewer:  "claude-4.6-sonnet"  # 芸術的なリファクタリング提案
  reflector: "gemini-2.5-Pro"     # 「大図書館」の司書として最高峰